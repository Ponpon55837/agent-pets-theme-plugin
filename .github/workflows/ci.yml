name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: npm test
      - name: Validate themes and package rules
        run: npm run validate
      - name: Build the unsigned package
        run: npm run build
      - name: Verify the built archive
        run: npm run verify -- dist/unsigned/panel-theme-collection-$(node -p "require('./src/plugin.json').version").agentpet-plugin
