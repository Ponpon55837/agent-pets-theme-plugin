name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: npm test
      - name: Validate themes and package rules
        run: npm run validate
      - name: Build the unsigned package
        run: npm run build
      - name: Verify the built archive
        run: npm run verify -- dist/unsigned/panel-theme-collection-$(node -p "require('./src/plugin.json').version").agentpet-plugin
