name: Release

# Signs, verifies and publishes one version. A push of the tag v<version> starts it;
# a manual run must be started from that tag and repeat its version.
#
# Jobs and what they hold:
#   gate           read only; tests (with the app's code), validation, the live catalog
#   sign           release environment, the signing key
#   catalog-check  read only; runs the catalog's own validator on the prepared change
#   release        contents: write; creates the GitHub Release
#   catalog        release environment, the catalog token; pushes the branch, opens the PR
# Jobs that hold a secret run only this repository's scripts, git, gh and the pinned
# GitHub actions: no npm or pnpm packages and no catalog code. Each job checks the tag
# again and reads the version, archive name and key fingerprint from its own checkout.
# Only the archive and its SHA-256 pass from sign to later jobs, which re-verify both and
# rebuild everything else from them. Every job can be re-run: an existing release or
# catalog branch is reused only when it is identical.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must equal the tag this run is started from, without the v)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CATALOG_REPO: Ponpon55837/agent-pets-plugins
  TAG: ${{ github.ref_name }}

defaults:
  run:
    # Explicit bash adds -o pipefail to GitHub's default -e.
    shell: bash

jobs:
  gate:
    name: Check the tag, tests and catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check the ref type and input
        env:
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::Start the release from a tag v<version>, not from a branch."
            exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ] && [ "v$INPUT_VERSION" != "$TAG" ]; then
            echo "::error::The version input does not match the tag this run was started from."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: plugin
          persist-credentials: false

      - name: Check the tag
        working-directory: plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/check-ref.sh

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: plugin/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        working-directory: plugin
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        working-directory: plugin
        run: pnpm typecheck

      - name: Read the pinned app commit
        id: vendor
        working-directory: plugin
        run: |
          commit=$(node -p "require('./scripts/lib/rules/vendor.json').commit")
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::vendor.json pins no commit."; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # The app modules the contract tests import need fflate (the version in the app's lockfile).
      - name: Check out the app at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ponpon55837/agent-pets
          ref: ${{ steps.vendor.outputs.commit }}
          path: app-deps/agent-pets
          persist-credentials: false

      # Outside the plugin checkout, so it never touches the plugin's lockfile.
      - name: Install the app modules' dependency
        working-directory: app-deps
        run: |
          echo '{"private":true}' > package.json
          pnpm add --ignore-scripts --ignore-workspace fflate@0.8.3

      - name: Tests (with the app contract)
        working-directory: plugin
        env:
          AGENT_PETS_APP_DIR: ${{ github.workspace }}/app-deps/agent-pets
        run: pnpm test

      - name: Validate
        working-directory: plugin
        run: pnpm validate

      - name: Compare the vendored rules with the app
        working-directory: plugin
        run: node scripts/sync-rules.ts --app ../app-deps/agent-pets --check

      - name: Check the version against the tag and the catalog
        working-directory: plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$CATALOG_REPO/contents/index.json" -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/index.json"
          node scripts/release-check.ts --tag "$TAG" --catalog "$RUNNER_TEMP/index.json"

  sign:
    name: Sign and verify
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.measure.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Again here, so the key is never used for a commit that is not on main.
      - name: Check the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/check-ref.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Read the version
        id: facts
        run: node scripts/release-check.ts --tag "$TAG" | tee -a "$GITHUB_OUTPUT"

      # RUNNER_TEMP is outside the work tree, which sign.ts requires; umask 077 gives mode 0600.
      - name: Write the signing key
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          if [ -z "$PLUGIN_SIGNING_KEY" ]; then
            echo "::error::The release environment has no PLUGIN_SIGNING_KEY secret."
            exit 1
          fi
          umask 077
          printf '%s\n' "$PLUGIN_SIGNING_KEY" > "$RUNNER_TEMP/signing-key.pem"

      - name: Sign
        run: node scripts/sign.ts --key "$RUNNER_TEMP/signing-key.pem"

      - name: Remove the signing key
        if: always()
        run: |
          key="$RUNNER_TEMP/signing-key.pem"
          if [ -e "$key" ]; then shred -u "$key" 2>/dev/null || rm -f "$key"; fi

      # The fingerprint comes from publisher.json, so a replaced secret cannot publish.
      - name: Verify against the pinned key
        id: measure
        env:
          ARCHIVE: ${{ steps.facts.outputs.archive }}
          FINGERPRINT: ${{ steps.facts.outputs.fingerprint }}
        run: |
          node scripts/verify.ts --require-signature --fingerprint "$FINGERPRINT" "dist/$ARCHIVE"
          sha256=$(sha256sum "dist/$ARCHIVE" | cut -d ' ' -f 1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          # Only the archive is handed on; later jobs rebuild every other file from it.
          mkdir -p "$RUNNER_TEMP/release"
          cp "dist/$ARCHIVE" "$RUNNER_TEMP/release/"

      # Signing is deterministic, so a re-run uploads the same bytes in place of the old artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-package
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  catalog-check:
    name: Check the catalog change
    needs: [gate, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      base: ${{ steps.base.outputs.base }}
      tree: ${{ steps.prepare.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: plugin
          persist-credentials: false

      - name: Check the tag
        id: ref
        working-directory: plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/check-ref.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-package
          path: ${{ runner.temp }}/release

      - name: Verify the downloaded package
        id: package
        working-directory: plugin
        env:
          SHA256: ${{ needs.sign.outputs.sha256 }}
        run: bash scripts/ci/verify-package.sh "$RUNNER_TEMP/release"

      - name: Check out the catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CATALOG_REPO }}
          ref: main
          path: catalog
          persist-credentials: false

      # An untouched copy runs the validator, as the catalog's own pull request check runs the base branch's.
      - name: Keep the base
        id: base
        run: |
          cp -R catalog catalog-base
          echo "base=$(git -C catalog-base rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Add the package and the index entry
        id: prepare
        env:
          ARCHIVE_PATH: ${{ steps.package.outputs.path }}
          PUBLISHED_AT: ${{ steps.ref.outputs.published_at }}
        run: bash plugin/scripts/ci/catalog-prepare.sh catalog "$ARCHIVE_PATH" "$PUBLISHED_AT"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: catalog-base/package.json

      - name: Run the catalog validator
        working-directory: catalog-base
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          report="$RUNNER_TEMP/catalog-report.md"
          # The validator derives the local package URL prefix from GITHUB_REPOSITORY.
          status=0
          GITHUB_REPOSITORY="$CATALOG_REPO" node scripts/validate-catalog.ts --pr ../catalog --base . --summary "$report" || status=$?
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"

  release:
    name: GitHub Release
    needs: [gate, sign, catalog-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check the tag
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/check-ref.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-package
          path: ${{ runner.temp }}/release

      - name: Verify the downloaded package
        id: package
        env:
          SHA256: ${{ needs.sign.outputs.sha256 }}
        run: bash scripts/ci/verify-package.sh "$RUNNER_TEMP/release"

      - name: Write the notes and the catalog entry
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          ARCHIVE_PATH: ${{ steps.package.outputs.path }}
          TAG_OBJECT: ${{ steps.ref.outputs.tag_object }}
          PUBLISHED_AT: ${{ steps.ref.outputs.published_at }}
        run: |
          # An annotated tag's message (without its signature block) heads the notes.
          message="$RUNNER_TEMP/tag-message.txt"
          : > "$message"
          if [ -n "$TAG_OBJECT" ]; then gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT" --jq .message > "$message"; fi
          node scripts/release-text.ts title --archive "$ARCHIVE_PATH" > "$RUNNER_TEMP/title.txt"
          node scripts/release-text.ts notes --archive "$ARCHIVE_PATH" --tag-message "$message" > "$RUNNER_TEMP/notes.md"
          # The same entry the catalog pull request adds: rebuilt from the archive with the tag's date.
          node scripts/catalog-entry.ts "$ARCHIVE_PATH" --published-at "$PUBLISHED_AT" > "$RUNNER_TEMP/release/${ARCHIVE%.agentpet-plugin}.catalog-entry.json"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          # Once more right before publishing, so a tag moved meanwhile is not released.
          bash scripts/ci/check-ref.sh
          dir="$RUNNER_TEMP/release"
          bash scripts/ci/publish-release.sh "$(cat "$RUNNER_TEMP/title.txt")" "$RUNNER_TEMP/notes.md" \
            "$dir/$ARCHIVE" "$dir/${ARCHIVE%.agentpet-plugin}.catalog-entry.json"

  catalog:
    name: Catalog pull request
    needs: [gate, sign, catalog-check, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: plugin
          persist-credentials: false

      - name: Check the tag
        id: ref
        working-directory: plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/check-ref.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-package
          path: ${{ runner.temp }}/release

      - name: Verify the downloaded package
        id: package
        working-directory: plugin
        env:
          SHA256: ${{ needs.sign.outputs.sha256 }}
        run: bash scripts/ci/verify-package.sh "$RUNNER_TEMP/release"

      # The base the validator passed, so the pushed change is exactly the checked one.
      - name: Check out the catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CATALOG_REPO }}
          ref: ${{ needs.catalog-check.outputs.base }}
          path: catalog
          persist-credentials: false

      - name: Add the package and the index entry
        id: prepare
        env:
          ARCHIVE_PATH: ${{ steps.package.outputs.path }}
          PUBLISHED_AT: ${{ steps.ref.outputs.published_at }}
          CHECKED_BASE: ${{ needs.catalog-check.outputs.base }}
          CHECKED_TREE: ${{ needs.catalog-check.outputs.tree }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CHECKED_BASE" ] || [ "$(git -C catalog rev-parse HEAD)" != "$CHECKED_BASE" ]; then
            echo "::error::The catalog checkout is not the base the validator checked."
            exit 1
          fi
          bash plugin/scripts/ci/catalog-prepare.sh catalog "$ARCHIVE_PATH" "$PUBLISHED_AT"
          if [ "$(git -C catalog rev-parse 'HEAD^{tree}')" != "$CHECKED_TREE" ]; then
            echo "::error::The catalog change differs from the one the validator checked."
            exit 1
          fi
          node plugin/scripts/release-text.ts pr-title --archive "$ARCHIVE_PATH" > "$RUNNER_TEMP/pr-title.txt"
          node plugin/scripts/release-text.ts pr-body --archive "$ARCHIVE_PATH" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --release-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" > "$RUNNER_TEMP/pr-body.md"
          # Once more right before the push, so a tag moved meanwhile is not published.
          (cd plugin && bash scripts/ci/check-ref.sh)

      # The only step that sees the catalog token: it runs git and gh, nothing from either repository's dependencies.
      - name: Push the branch and open the pull request
        env:
          GH_TOKEN: ${{ secrets.CATALOG_PR_TOKEN }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
        run: bash plugin/scripts/ci/catalog-pr.sh catalog "$BRANCH" "$RUNNER_TEMP/pr-title.txt" "$RUNNER_TEMP/pr-body.md"
